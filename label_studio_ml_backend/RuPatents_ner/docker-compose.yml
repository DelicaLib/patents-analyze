version: "3.8"

services:
  ml-backend:
    container_name: ml-backend
    image: humansignal/ml-backend:v0
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      - LOG_LEVEL=DEBUG
      - ANY=PARAMETER
      - WORKERS=1
      - THREADS=8
      - MODEL_DIR=/data/models
    ports:
      - "9091:9090"
    volumes:
      - "./data/server:/data"
      - ./model.py:/app/model.py
    networks:
      - labelstudio

networks:
  labelstudio:
    external: true
